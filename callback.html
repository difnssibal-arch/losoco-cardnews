<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 인증 완료</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 40px; text-align: center; max-width: 480px; width: 90%; }
  .logo { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #888; font-size: 14px; margin-bottom: 24px; }
  .code-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; word-break: break-all; text-align: left; margin-bottom: 16px; }
  .code-box span { color: #fe2c55; }
  .code-box .value { color: #25f4ee; }
  button { background: #fe2c55; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; cursor: pointer; width: 100%; }
  button:hover { background: #e0253e; }
  .status { margin-top: 12px; font-size: 13px; color: #888; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎵</div>
  <h1>TikTok 인증 완료</h1>
  <p>아래 코드를 복사해서 tiktok_auth.py를 실행 중인 터미널에 붙여넣으세요.</p>

  <div class="code-box" id="codeBox">
    <div>code: <span class="value" id="codeVal">불러오는 중...</span></div>
    <div style="margin-top:8px">state: <span class="value" id="stateVal">-</span></div>
  </div>

  <button onclick="copyCode()">📋 코드 복사</button>
  <div class="status" id="status"></div>

  <div id="errorBox" class="hidden" style="margin-top:20px; color:#fe2c55; font-size:13px;"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  if (error) {
    document.getElementById('codeVal').textContent = '인증 실패';
    document.getElementById('errorBox').textContent = '오류: ' + error + ' — ' + (params.get('error_description') || '');
    document.getElementById('errorBox').classList.remove('hidden');
  } else if (code) {
    document.getElementById('codeVal').textContent = code;
    document.getElementById('stateVal').textContent = state || '-';
  } else {
    document.getElementById('codeVal').textContent = '파라미터 없음';
    document.getElementById('errorBox').textContent = '직접 접근하거나 코드가 전달되지 않았습니다.';
    document.getElementById('errorBox').classList.remove('hidden');
  }

  function copyCode() {
    const text = code || '';
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('status').textContent = '✅ 복사 완료! 터미널에 붙여넣으세요.';
    }).catch(() => {
      document.getElementById('status').textContent = '위 코드를 수동으로 복사하세요.';
    });
  }
</script>
</body>
</html>
